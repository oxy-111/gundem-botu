name: Gündem Botu

on:
  schedule:
    # Her 30 dakikada bir çalışır (UTC saatine göre). GitHub'ın yoğunluğuna
    # göre birkaç dakika gecikme olabilir, bu normaldir.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # Bu sayede GitHub sayfasından "Run workflow" ile elle de tetikleyebilirsin

permissions:
  contents: write   # bot'un sayfayı repoya geri commit'leyebilmesi için gerekli

jobs:
  gundem-calistir:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır (docs/index.html üretir)
        run: python gundem_bot.py

      - name: Sayfayı repoya geri gönder
        run: |
          git config user.name "gundem-botu"
          git config user.email "gundem-botu@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atılmayacak."
          else
           git commit -m "Gündem güncellendi $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
