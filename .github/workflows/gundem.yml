name: Gündem Botu

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gundem-calistir:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır (docs/index.html üretir)
        run: python gundem_bot.py

      - name: Sayfayı repoya geri gönder
        run: |
          git config user.name "gundem-botu"
          git config user.email "gundem-botu@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atılmayacak."
          else
            git commit -m "Gündem güncellendi"
            git pull --rebase origin main
            git push
          fi
